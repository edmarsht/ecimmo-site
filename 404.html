<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — E&C IMMO</title>
<meta name="description" content="Cette page n'existe pas ou plus. Retrouvez l'accueil d'E&C IMMO, sous-location professionnelle et loyer garanti chaque mois.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://ec-immo.fr/">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,450&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#122038;
    --ink-soft:#1c2f4d;
    --paper:#efece2;
    --card:#f7f5ec;
    --text:#1a2233;
    --slate:#5b6472;
    --line-dark:#31456a;
    --brass:#a9824c;
    --brass-light:#cba86a;
    --radius:2px;
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--paper);
    background:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  img{max-width:100%; display:block;}
  a{color:inherit;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 32px; width:100%;}
  @media (max-width:640px){ .wrap{padding:0 20px;} }

  header.site{padding:22px 0;}
  header.site .wrap{display:flex; align-items:center; justify-content:space-between;}
  .logo{display:flex; align-items:center; text-decoration:none;}
  .logo img{height:28px; width:auto; display:block;}
  @media (max-width:640px){ .logo img{height:20px;} }

  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(239,236,226,.4);
    display:flex; align-items:center; gap:10px;
    justify-content:center;
  }
  .eyebrow::before{content:""; width:22px; height:1px; background:rgba(239,236,226,.3);}

  main{flex:1; display:flex; align-items:center;}
  .error-content{
    max-width:560px; margin:0 auto; padding:60px 0 90px; text-align:center;
  }
  .error-code{
    font-family:var(--serif); font-weight:600; line-height:1;
    font-size:clamp(110px,20vw,200px);
    color:var(--brass);
    margin:14px 0 0;
    letter-spacing:-.02em;
  }
  h1{
    font-family:var(--sans); font-weight:600; line-height:1.3;
    font-size:15px;
    color:rgba(239,236,226,.75);
    margin:22px 0 0;
    letter-spacing:0;
  }
  h1 i{font-style:italic; color:var(--brass-light);}
  p.lead{
    font-size:13px; line-height:1.6; color:rgba(239,236,226,.42);
    max-width:400px; margin:8px auto 34px;
  }
  .ctas{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    font-family:var(--sans); font-weight:500; font-size:13px;
    padding:10px 20px;
    border-radius:var(--radius);
    text-decoration:none;
    cursor:pointer;
    border:1px solid transparent;
    transition:transform .25s ease, background .25s ease, color .25s ease, border-color .25s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-brass{background:var(--brass); color:var(--ink);}
  .btn-brass:hover{background:var(--brass-light);}
  .btn-ghost{background:transparent; color:rgba(239,236,226,.6); border-color:rgba(239,236,226,.2);}
  .btn-ghost:hover{border-color:rgba(239,236,226,.5); color:var(--paper);}

  footer{border-top:1px solid rgba(255,255,255,.1); padding:28px 0;}
  footer .wrap{display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px; align-items:center;}
  footer p{font-size:12.5px; color:rgba(239,236,226,.45); margin:0; font-family:var(--mono);}
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a href="/" class="logo"><img src="assets/logo-header.png" alt="E&C IMMO" height="28"></a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="error-content">
      <div class="eyebrow">Erreur</div>
      <div class="error-code">404</div>
      <h1>Cette page n'est plus dans nos <i>murs</i>.</h1>
      <p class="lead">Le lien que vous avez suivi est cassé, ou la page a été déplacée.</p>
      <div class="ctas">
        <a href="/" class="btn btn-brass">Retour à l'accueil</a>
        <a href="/#contact" class="btn btn-ghost">Nous contacter</a>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>© <span id="year"></span> SAS E&amp;C IMMO, RCS Paris 989 829 213, 101 rue Mademoiselle, 75015 Paris</p>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
